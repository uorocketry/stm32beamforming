name: firmware-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cppcheck \
            gcc \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            make \
            python3

      - name: Run host protocol tests
        run: |
          make -C tests clean test
          make -C tests clean test \
            CFLAGS="-std=c17 -Wall -Wextra -Werror -pedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          python3 tests/test_can_smoke_tool.py

      - name: Run C static analysis
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --std=c17 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -DSTM32F0 -DSTM32F072R8T6 -DBEAMFORMER_NODE_ID=1 \
            -Iapp/include -Ilibopencm3/include \
            app/src

      - name: Build libopencm3 for STM32F0
        run: make -C libopencm3 TARGETS=stm32/f0 -j2

      - name: Build firmware for three receiver nodes
        run: |
          artifact_root="${RUNNER_TEMP}/stm32beamforming"
          mkdir -p "${artifact_root}"
          for node_id in 1 2 3; do
            make -C app clean
            make -C app all -j2 \
              GIT_REVISION="${GITHUB_SHA}" \
              CAN_NODE_ID="${node_id}"
            node_dir="${artifact_root}/node-${node_id}"
            mkdir -p "${node_dir}"
            cp app/build/stm32beamforming.elf \
              "${node_dir}/stm32beamforming-node-${node_id}.elf"
            cp app/build/stm32beamforming.bin \
              "${node_dir}/stm32beamforming-node-${node_id}.bin"
            cp app/build/stm32beamforming.map \
              "${node_dir}/stm32beamforming-node-${node_id}.map"
            arm-none-eabi-size app/build/stm32beamforming.elf \
              | tee "${node_dir}/stm32beamforming-node-${node_id}.size.txt"
          done

      - name: Verify generated files are ignored
        run: git diff --exit-code

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stm32beamforming-nodes-1-3-${{ github.sha }}
          path: ${{ runner.temp }}/stm32beamforming
          if-no-files-found: error
          retention-days: 30
